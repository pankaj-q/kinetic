services:
  # 1. PostgreSQL Database with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kinetic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kinetic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kinetic}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kinetic-network

  # 2. JobAgent AI OS Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetic-app
    restart: unless-stopped
    ports:
      - "${PORT:-3005}:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-kinetic}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kinetic-network

volumes:
  postgres_data:
    driver: local

networks:
  kinetic-network:
    driver: bridge
