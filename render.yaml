services:
  # 1. JobAgent AI OS Web Application
  - type: web
    name: jobagent-ai-os
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: jobagent-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  # 2. Managed PostgreSQL
  - name: jobagent-postgres
    plan: free
    databaseName: kinetic
    user: postgres
